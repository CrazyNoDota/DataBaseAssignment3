{% extends "layout.html" %}
{% block content %}
    <h1>Jobs</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Type</th>
                <th>Requirements</th>
                <th>Date Posted</th>
            </tr>
        </thead>
        <tbody>
            {% for job in jobs %}
            <tr>
                <td>{{ job.job_id }}</td>
                <td>{{ job.required_caregiving_type }}</td>
                <td>{{ job.other_requirements }}</td>
                <td>{{ job.date_posted }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
