{% extends "layout.html" %}
{% block content %}
    <h1>Post a Job</h1>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Required Caregiving Type:</label>
            <select name="required_caregiving_type" class="form-select" required>
                <option value="" disabled selected>Select a type</option>
                <option value="babysitter">Babysitter</option>
                <option value="elderly_care">Elderly Care</option>
                <option value="playmate">Playmate for Children</option>
                <option value="supertype">Supertype</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Person's Age:</label>
            <input type="number" name="person_age" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Preferred Time Interval (e.g., 09:00-12:00):</label>
            <input type="text" name="time_interval" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Frequency (e.g., weekly, daily):</label>
            <input type="text" name="frequency" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Other Requirements:</label>
            <textarea name="other_requirements" class="form-control"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Date Posted:</label>
            <input type="date" name="date_posted" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary">Post Job</button>
    </form>
{% endblock %}
