{% extends "layout.html" %}
{% block content %}
    <h1>Users</h1>
    <a href="/users/create" class="btn btn-success mb-3">Add New User</a>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>City</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.user_id }}</td>
                <td>{{ user.given_name }} {{ user.surname }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.city }}</td>
                <td>
                    <a href="/users/{{ user.user_id }}" class="btn btn-sm btn-info">View Profile</a>
                    <a href="/users/edit/{{ user.user_id }}" class="btn btn-sm btn-primary">Edit</a>
                    <a href="/users/delete/{{ user.user_id }}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
